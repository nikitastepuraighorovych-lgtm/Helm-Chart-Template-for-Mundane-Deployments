{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "template.fullname" . }}
  labels:
    {{- include "template.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.configMap.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- range .Values.configMap.files }}
  {{ .key }}: |
{{ .content | indent 4 }}
  {{- end }}
  {{- if .Values.configMap.filesGlob }}
  {{- $files := .Files.Glob .Values.configMap.filesGlob }}
  {{- if $files }}
  {{- range $path, $content := $files }}
  {{ base $path }}: |
{{ $content | toString | indent 4 }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
