# CONFIGMAP

configMap:
  enabled: false

  # Option 1: Inline key-value pairs (also injected as env vars via envFrom)
  data: {}
    # APP_ENV: "production"
    # APP_DEBUG: "false"
    # LOG_LEVEL: "info"
    # DB_HOST: "postgres.default.svc.cluster.local"
    # DB_PORT: "5432"

  # Option 2: Individual files with inline content
  files: []
    # - key: nginx.conf
    #   content: |
    #     server {
    #         listen 80;
    #         server_name localhost;
    #         location / {
    #             root /usr/share/nginx/html;
    #             index index.html;
    #         }
    #     }
    # - key: app-config.json
    #   content: |
    #     {
    #       "database": "mydb",
    #       "cache_ttl": 300,
    #       "features": {
    #         "dark_mode": true,
    #         "beta": false
    #       }
    #     }

  # Option 3: All files from a directory inside your chart
  # Place files in: my-chart/config/*
  # filesGlob: "config/*"
  filesGlob: ""


# SECRET

secret:
  enabled: false
  type: Opaque    # Options: Opaque, kubernetes.io/tls, kubernetes.io/dockerconfigjson

  # Option 1: Plain text keys (K8s auto base64-encodes)
  # WARNING: Don't commit real secrets to Git!
  # Use: helm install --set secret.stringData.DB_PASSWORD=xxx
  # Or use sealed-secrets / external-secrets / vault
  stringData: {}
    # DB_PASSWORD: "changeme"
    # API_KEY: "changeme"
    # REDIS_URL: "redis://:changeme@redis:6379/0"

  # Option 2: Already base64-encoded values
  data: {}
    # DB_PASSWORD: Y2hhbmdlbWU=
    # API_KEY: Y2hhbmdlbWU=

  # Option 3: Individual secret files with inline content
  files: []
    # - key: tls.crt
    #   content: |
    #     -----BEGIN CERTIFICATE-----
    #     ...
    #     -----END CERTIFICATE-----
    # - key: tls.key
    #   content: |
    #     -----BEGIN PRIVATE KEY-----
    #     ...
    #     -----END PRIVATE KEY-----
    # - key: credentials.json
    #   content: |
    #     {
    #       "client_id": "xxx",
    #       "client_secret": "yyy"
    #     }

  # Option 4: All files from a directory inside your chart
  # Place files in: my-chart/secrets/*
  # filesGlob: "secrets/*"
  filesGlob: ""

