# PERSISTENCE (PVC)
persistence:
  enabled: false
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /data
  # storageClass: ""


# SHARED emptyDir VOLUME (between containers)
sharedVolume:
  enabled: false


