# JOB (one-time task)

job:
  enabled: false
  image:
    repository: busybox
    tag: "1.36"
    pullPolicy: IfNotPresent
  command: []
    # - sh
    # - -c
    # - |
    #   echo "Running database migration..."
    #   /app/migrate.sh
    #   echo "Migration complete."
  args: []
  env: []
    # - name: DB_HOST
    #   value: "postgres"
  resources: {}
    # limits:
    #   cpu: 200m
    #   memory: 256Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  # Number of retries before marking job as failed.
  backoffLimit: 3
  # Auto-delete job after N seconds when finished.
  # ttlSecondsAfterFinished: 3600
  # Kill job if it runs longer than N seconds.
  # activeDeadlineSeconds: 600
  # Run N pods in parallel.
  # parallelism: 1
  # Total number of successful completions needed.
  # completions: 1
  restartPolicy: Never    # Options: Never, OnFailure
  annotations: {}
    # "helm.sh/hook": post-install
    # "helm.sh/hook-weight": "0"
    # "helm.sh/hook-delete-policy": hook-succeeded
  podAnnotations: {}
  volumeMounts: []
  volumes: []


